<html>
    <head>
        <meta charset="uft-8"/>
        <script = "text/javascript">
            var a = 10;
            var b = 20;
            var c = 0.3;
            var d = 0.2;
            // 문자형 + 정수형 = 문자형
            document.write("a + b = "+ (a+b) +"<br/>");
            document.write("a - b = "+ (a-b) +"<br/>");
            document.write("c * d = "+ (c*d) +"<br/>");
            document.write("c / d = "+ (c/d) +"<br/>");
        </script>
    </head>
</html>
